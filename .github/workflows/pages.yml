name: Publish the static demo

# Publishes the offline demo build (deploy/firebase/public-demo) on GitHub Pages,
# which is free and needs no billing account. Firebase Hosting is still the
# documented deployment (docs/DEPLOY_PUBLIC.md); this workflow is simply a second
# public link for the same static demo copy, so the page can be shown on a phone
# without a Firebase account.
#
# ONE MANUAL STEP IS NEEDED FIRST : open
#     Settings -> Pages -> Build and deployment -> Source : GitHub Actions
# Until that is done the workflow finishes with a green "notice" and publishes
# nothing, so no push turns red.
#
# What is published : the unchanged page (index.html, app.js, styles.css) plus
# demo-backend.js, which answers every /api/... call inside the browser. The page
# shows a DEMO MODE badge, because no Java server runs here. GitHub Pages cannot
# run Java either - for the real backend use Firebase Hosting + Cloud Run
# (option A in docs/DEPLOY_PUBLIC.md).

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'arena/**'
    paths:
      - 'resources/static/**'
      - 'deploy/firebase/**'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build the demo folder
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.pages.outcome }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Copy the page next to the demo backend
        run: bash deploy/firebase/sync-public.sh

      # This action fails while Pages is switched off, which must not break the
      # build, so the failure is caught and reported as a notice instead.
      - name: Prepare Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Upload the demo folder
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy/firebase/public-demo

      - name: Explain what to do when Pages is off
        if: steps.pages.outcome != 'success'
        run: |
          echo "::notice title=GitHub Pages is not switched on::Open Settings -> Pages ->" \
               "Build and deployment -> Source : GitHub Actions, then run this workflow" \
               "again (docs/DEPLOY_PUBLIC.md, option C). Nothing was published."

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: needs.build.outputs.pages == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
